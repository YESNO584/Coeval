# Fabrique le socle de Coeval et publie la page sur GitHub Pages.
#
# Deux réglages ont été faits une fois, à la main, dans le dépôt — une session
# Claude Code n'y a pas accès :
#   Settings → Actions → General : autoriser les workflows
#   Settings → Pages → Source    : choisir « GitHub Actions »
#
# Adresse publiée : https://yesno584.github.io/Coeval/

name: Fabriquer et publier

on:
  schedule:
    # 04h10 UTC. L'heure importe peu : Wikidata n'a pas d'horaire de
    # publication. La nuit évite simplement de croiser les heures de pointe
    # de son service public.
    - cron: "10 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "socle/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    name: Vérifier la fabrique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        working-directory: socle
        run: |
          python test_socle.py
          python test_fusion.py

  publier:
    name: Fabriquer et publier
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Le socle se garde d'une nuit sur l'autre, et chaque exécution ne
      # complète que ce qui manque.
      #
      # **L'empreinte des règles fait partie de la clé, et c'est
      # indispensable.** Le cache ne contient que ce que les règles
      # retenaient le jour où il a été rempli : modifier une requête ou le
      # périmètre sans jeter le cache laisserait en ligne un socle d'hier,
      # auquel les nouvelles règles ne s'appliqueraient plus. Avec
      # l'empreinte, une modification refait la fabrique une fois, toute
      # seule — personne n'a à y penser. Motif repris du dépôt AN-API.
      - name: Retrouver le socle des nuits précédentes
        uses: actions/cache@v4
        env:
          # wikidata.py et construire.py en font partie depuis le
          # 2026-09-20 : ils décident comment une case est interrogée, donc
          # aussi si elle échoue. Sans eux, un correctif qui fait passer une
          # case ne la ferait jamais rejouer — les échecs notés dans le cache
          # la feraient sauter chaque nuit, et le correctif resterait lettre
          # morte. Le prix est qu'une retouche de ces deux fichiers refait la
          # fabrique entière ; c'est le bon prix pour ce qu'ils commandent.
          REGLES: ${{ hashFiles('socle/requetes.py', 'socle/modele.py', 'socle/wikidata.py', 'socle/construire.py', 'socle/perimetre.json', 'socle/config.json') }}
        with:
          path: socle/cache
          key: socle-${{ env.REGLES }}-${{ github.run_id }}
          restore-keys: socle-${{ env.REGLES }}-

      # Deux rythmes, et il ne faut pas les confondre.
      #
      # Publier la page doit être rapide : on corrige une virgule, on veut la
      # voir. Fabriquer le socle est long. Enchaîner les deux faisait payer à
      # la première le temps de la seconde — deux heures d'attente pour une
      # modification de style. Sur un push, on se contente donc de reprendre
      # le socle déjà fabriqué ; la fabrique elle-même ne tourne que la nuit
      # ou sur demande.
      #
      # Volontairement facultatif dans les deux cas. Le service public de
      # Wikidata limite le débit d'un client qui l'interroge sans répit :
      # erreur 429 constatée le 2026-09-19 après une heure d'interrogations
      # soutenues. La fabrique s'arrête alors proprement et reprend la nuit
      # suivante. Sans ce « continue-on-error », une nuit limitée empêcherait
      # aussi la page de se publier — alors qu'elle sait très bien
      # fonctionner en interrogeant Wikidata en direct.
      - name: Fabriquer ou reprendre le socle
        working-directory: socle
        continue-on-error: true
        timeout-minutes: 150
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push : on reprend le socle déjà fabriqué, sans rien demander à Wikidata."
            python -u construire.py --sans-reseau
          else
            python -u construire.py --budget-minutes 120
          fi

      - name: Assembler le site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r css js site/
          if [ -d socle/public/data ]; then
            cp -r socle/public/data site/data
            echo "socle publié : $(ls site/data | wc -l) fichiers"
          else
            echo "::warning::pas de socle cette fois — la page interrogera Wikidata en direct"
          fi

      # Un site publié sans son code s'afficherait vide, sans rien dire de
      # son échec. Vérifier avant de publier, comme le fait AN-API.
      - name: Refuser de publier un site incomplet
        run: |
          for fichier in site/index.html site/css/base.css site/js/app.js; do
            if [ ! -s "$fichier" ]; then
              echo "::error::$fichier manque ou est vide — on ne publie pas."
              exit 1
            fi
          done
          echo "$(find site -type f | wc -l) fichiers prêts à publier."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
